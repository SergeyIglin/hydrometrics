[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrometrics"
version = "0.1.0"
description = "Hydrological and hydrometeorological model evaluation metrics library"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sergey Iglin", email = "iglin.sm@bk.ru"}
]
keywords = [
    "hydrology",
    "hydrometeorology",
    "metrics",
    "evaluation",
    "nse",
    "kge",
    "time-series",
    "water-resources"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=0.19"]
xarray = ["xarray>=2023.1"]
# scipy is needed only by spearman_r and kendall_tau
scipy = ["scipy>=1.10"]
all = [
    "hydrometrics[pandas,polars,xarray,scipy]",
]
test = [
    "hydrometrics[all]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
dev = [
    "hydrometrics[test]",
    "ruff>=0.1",
    "mypy>=1.5",
    "pre-commit>=3.5",
]
docs = [
    "hydrometrics[all]",
    "sphinx==9.1.0",
    "pydata-sphinx-theme==0.23.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.7.0",
    "sphinx-gallery==0.22.1",
    "sphinxcontrib-bibtex==2.7.0",
    "sphinx-intl==2.4.0",
    "matplotlib==3.11.2",
]
crosscheck = [
    "hydrometrics[all]",
    "scikit-learn",
    "properscoring",
    "scoringrules",
    "hydroeval",
    "HydroErr",
]

[project.urls]
Homepage = "https://github.com/SergeyIglin/hydrometrics"
Repository = "https://github.com/SergeyIglin/hydrometrics"
Documentation = "https://hydrometrics.readthedocs.io"
Issues = "https://github.com/SergeyIglin/hydrometrics/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hydrometrics*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
hydrometrics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N806",  # variable in function should be lower case (for constants)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["hydrometrics"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2
show_missing = true
skip_covered = true

[tool.hypothesis]
database = ".hypothesis"
verbosity = "normal"
phases = ["explicit", "reuse", "generate", "shrink"]
max_examples = 100
suppress_health_check = ["data_too_large", "filter_too_much"]